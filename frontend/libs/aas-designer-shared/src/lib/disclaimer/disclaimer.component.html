<nav class="disclaimer" [class.disclaimer-vertical]="direction === 'vertical'" [class.disclaimer-compact]="compact">
  @for (link of links; track link.label; let first = $first) {
    @if (!first && !compact) {
      <em class="pi pi-circle-fill disclaimer-separator" aria-hidden="true"></em>
    }
    <a
      class="disclaimer-link"
      target="_blank"
      rel="noopener noreferrer"
      pButton
      [text]="true"
      [size]="compact ? 'small' : undefined"
      [href]="link.href"
      >{{ link.translate ? (link.label | translate) : link.label }}</a
    >
  }
</nav>
