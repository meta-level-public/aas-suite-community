@if (portalService.loggedIn) {
  @if (viewport.isMobile() && sidebarExpanded()) {
    <div class="sidebar-backdrop" (click)="toggleSidebar()" aria-hidden="true"></div>
  }
  <aside class="app-sidebar" [class.expanded]="sidebarExpanded()" [class.mobile]="viewport.isMobile()">
    <div class="sidebar-header">
      <button
        pButton
        [text]="true"
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        [pTooltip]="sidebarExpanded() ? ('COLLAPSE' | translate) : ('EXPAND' | translate)"
        [attr.aria-label]="sidebarExpanded() ? ('COLLAPSE' | translate) : ('EXPAND' | translate)"
        [attr.aria-expanded]="sidebarExpanded()"
        tooltipPosition="right"
      >
        <i pButtonIcon [class]="sidebarExpanded() ? 'pi pi-chevron-left' : 'pi pi-bars'"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (tab of tabs; track tab.routerLink) {
        <a
          [routerLink]="tab.routerLink"
          class="sidebar-item"
          [class.active]="isActive(tab)"
          [pTooltip]="!sidebarExpanded() ? tab.label : ''"
          tooltipPosition="right"
        >
          <span class="sidebar-icon-wrap">
            <i [class]="tab.icon" class="sidebar-icon"></i>
            @if (!sidebarExpanded() && tab.shortLabel) {
              <span class="sidebar-mini-label">{{ tab.shortLabel }}</span>
            }
          </span>
          @if (sidebarExpanded()) {
            <span class="sidebar-label">{{ tab.label }}</span>
          }
        </a>
      }
    </nav>
  </aside>
}
