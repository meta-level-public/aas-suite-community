@if (element != null) {
  <div class="flex flex-row w-full gap-2">
    <lib-help-label tag="ID_SHORT" class="w-14rem" class="w-14rem"></lib-help-label>
    <div class="flex flex-col gap-2 w-full">
      <p-inputgroup>
        <input
          pInputText
          [(ngModel)]="element.content.idShort"
          class="w-full"
          [required]="isRequired"
          nullIfEmpty
          [pKeyFilter]="idShortRegex"
          (ngModelChange)="onIdShortChange()"
        />
        <p-inputgroup-addon>
          <p-button
            [ariaLabel]="'REMOVE' | translate"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="element.content.idShort = null"
          />
        </p-inputgroup-addon>
      </p-inputgroup>
      @let idShortErrors = getError(element.content);
      @if (idShortErrors.length > 0) {
        <div class="text-error">
          {{ idShortErrors[0].message | verificationMessage }}
        </div>
      }
    </div>
  </div>
}
