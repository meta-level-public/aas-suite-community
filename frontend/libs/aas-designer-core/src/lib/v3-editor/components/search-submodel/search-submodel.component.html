<p-table [value]="submodels()" [tableStyle]="{ 'min-width': '50rem' }" [loading]="loading()">
  <ng-template #header>
    <tr>
      <th scope="col" class="w-[10%] min-w-12"></th>
      <th>{{ 'ID' | translate }}</th>
      <th>{{ 'ID_SHORT' | translate }}</th>
    </tr>
    <tr>
      <th scope="col" class="w-[10%] min-w-12"></th>
      <th><p-columnFilter type="text" field="id" matchMode="contains"></p-columnFilter></th>
      <th><p-columnFilter type="text" field="idShort" matchMode="contains"></p-columnFilter></th>
    </tr>
  </ng-template>
  <ng-template #body let-cd>
    <tr>
      <td>
        <p-button
          [ariaLabel]="'APPLY' | translate"
          icon="pi pi-arrow-circle-right"
          outlined="true"
          (onClick)="applyCd(cd)"
        ></p-button>
      </td>
      <td>
        <div>{{ cd.id }}</div>
        @if (cd.hasDuplicateId) {
          <div class="text-xs text-[var(--aas-warning-text)]">
            {{ 'DUPLICATE_ID_HINT' | translate: { index: cd.duplicateIndex, count: cd.duplicateCount } }}
          </div>
        }
      </td>
      <td>{{ cd.idShort }}</td>
    </tr>
  </ng-template>
  <ng-template #footer let-columns>
    <tr>
      <td [attr.colspan]="3">
        <aas-cursor-paginator
          [isFirstPage]="firstPage()"
          [hasNextPage]="cursor != null"
          [pageOptions]="pageOptions"
          [(pageSize)]="pageSize"
          (firstRequested)="loadFirstPage()"
          (nextRequested)="loadNextPage()"
          (pageSizeChanged)="loadFirstPage()"
        ></aas-cursor-paginator>
      </td>
    </tr>
  </ng-template>
</p-table>
