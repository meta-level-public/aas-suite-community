<div class="viewer-stack">
  @if (steps().length > 0) {
    @for (step of steps(); track $index) {
      <aas-pcf-step-viewer [step]="step"></aas-pcf-step-viewer>
    }

    <section class="viewer-card">
      <h3 class="viewer-card-title">
        <i class="fa-solid fa-map-location-dot pcf-map-icon"></i>
        {{ 'PRODUCTION_LOCATIONS' | translate }}
      </h3>
      <aas-address-map [steps]="steps()" [showHeader]="false"></aas-address-map>
    </section>
  } @else {
    <div class="viewer-empty">{{ 'PCF_VIEWER.NO_STEPS_FOUND' | translate }}</div>
  }
</div>
