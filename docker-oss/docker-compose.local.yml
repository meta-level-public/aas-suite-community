services:
  postgres:
    image: postgres:16-alpine
    container_name: aas-postgres-oss-dev
    environment:
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: "P@SSworDT!"
      POSTGRES_DB: designer
      BASYX_POSTGRES_DB: basyx_core
      KEYCLOAK_POSTGRES_DB: keycloak
      DPP_GATEWAY_POSTGRES_DB: dpp_gateway
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../deploy/shared/postgres-init/10-create-basyx-db.sh:/docker-entrypoint-initdb.d/10-create-basyx-db.sh:ro
    networks:
      - aas-oss-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localPostgres -d designer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-init:
    image: postgres:16-alpine
    container_name: aas-postgres-init-oss-dev
    environment:
      PGPASSWORD: "P@SSworDT!"
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: localPostgres
      POSTGRES_DB: designer
      BASYX_POSTGRES_DB: basyx_core
      KEYCLOAK_POSTGRES_DB: keycloak
      DPP_GATEWAY_POSTGRES_DB: dpp_gateway
    command: ["/bin/bash", "/scripts/10-create-basyx-db.sh"]
    volumes:
      - ../deploy/shared/postgres-init/10-create-basyx-db.sh:/scripts/10-create-basyx-db.sh:ro
    networks:
      - aas-oss-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aas-keycloak-oss-dev
    command: start-dev --http-port=8080 --hostname-strict=false --proxy-headers=xforwarded --import-realm --spi-theme-cache-themes=false --spi-theme-cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: localPostgres
      KC_DB_PASSWORD: P@SSworDT!
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8088:8080"
    volumes:
      - ../docker-oss/keycloak/aas-local-realm.json:/opt/keycloak/data/import/aas-local-realm.json:ro
      - ../docker-oss/keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - aas-oss-dev-network
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-dpp-bootstrap:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aas-keycloak-dpp-bootstrap-oss-local
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap-dpp-clients.sh"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      DPP_GATEWAY_CLIENT_SECRET: ${DPP_GATEWAY_CLIENT_SECRET:?DPP_GATEWAY_CLIENT_SECRET must be set}
      DPP_POLICY_ADMIN_CLIENT_SECRET: ${DPP_POLICY_ADMIN_CLIENT_SECRET:?DPP_POLICY_ADMIN_CLIENT_SECRET must be set}
    volumes:
      - ../deploy/shared/keycloak-bootstrap/bootstrap-dpp-clients.sh:/bootstrap/bootstrap-dpp-clients.sh:ro
    networks:
      - aas-oss-dev-network
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.26
    container_name: aas-mailpit-oss-dev
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - aas-oss-dev-network
    restart: unless-stopped

  basyx-config-init:
    image: eclipsebasyx/basyxconfigurationservice-go:1.0.12
    container_name: aas-basyx-config-init-oss-dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
    networks:
      - aas-oss-dev-network
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    restart: "no"

  aasregistry-go:
    image: eclipsebasyx/aasregistry-go:1.0.12
    container_name: aasregistry-go-oss-dev
    ports:
      - "5082:8082"
    environment:
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      VIRTUAL_PORT: 8082
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
    volumes:
      - ../tools/docker-compose-wizard/security_env:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully

  dppapi-go:
    image: eclipsebasyx/dppapi-go:1.0.12
    container_name: dppapi-go-oss-dev
    ports:
      - "127.0.0.1:5087:8080"
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      BASYX_HISTORY_MODE: audit
      ABAC_ENABLED: "true"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
      ABAC_POLICY_FILE_IMPORT: always
    volumes:
      - ../deploy/shared/dpp-security:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully
      keycloak-dpp-bootstrap:
        condition: service_completed_successfully

  dpp-gateway:
    build:
      context: ..
      dockerfile: services/dpp-gateway/Dockerfile
    container_name: dpp-gateway-oss-dev
    ports:
      - "${DPP_GATEWAY_PORT:-5090}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      DppGateway__Mode: SingleTenant
      DppGateway__SingleTenantUpstreamBaseUrl: http://dppapi-go:8080
      DppGateway__SingleTenantAttachmentBaseUrl: http://aasrepository-go:8081
      DppGateway__PublicationRegistryConnectionString: Host=postgres;Port=5432;Database=dpp_gateway;Username=localPostgres;Password=P@SSworDT!
      DppGateway__PublisherAuthority: http://keycloak:8080/realms/aas-local
      DppGateway__PublisherMetadataAddress: http://keycloak:8080/realms/aas-local/.well-known/openid-configuration
      DppGateway__PublisherValidIssuer: http://localhost:8088/realms/aas-local
      DppGateway__PublisherRequireHttpsMetadata: "false"
      DppGateway__PublisherAudience: dpp-gateway-management
      DppGateway__AccessTokenAudience: aas-designer-local
      DppGateway__SingleTenantInfrastructureId: single-tenant
      DppGateway__SingleTenantOAuth__Enabled: "true"
      DppGateway__SingleTenantOAuth__TokenEndpoint: http://keycloak:8080/realms/aas-local/protocol/openid-connect/token
      DppGateway__SingleTenantOAuth__ClientId: dpp-gateway
      DppGateway__SingleTenantOAuth__ClientSecret: ${DPP_GATEWAY_CLIENT_SECRET:?DPP_GATEWAY_CLIENT_SECRET must be set}
      DppGateway__SingleTenantOAuth__Scope: openid
      DppGateway__SingleTenantOAuth__TokenExchangeEnabled: "true"
      DppGateway__SingleTenantOAuth__Audience: dpp-api
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      dppapi-go:
        condition: service_started
      keycloak-dpp-bootstrap:
        condition: service_completed_successfully

  submodelregistry-go:
    image: eclipsebasyx/submodelregistry-go:1.0.12
    container_name: submodelregistry-go-oss-dev
    ports:
      - "5083:8083"
    environment:
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      VIRTUAL_PORT: 8083
      SERVER_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
    volumes:
      - ../tools/docker-compose-wizard/security_env:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully

  aasdiscovery-go:
    image: eclipsebasyx/aasdiscovery-go:1.0.12
    container_name: aasdiscovery-go-oss-dev
    ports:
      - "5084:8081"
    environment:
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      VIRTUAL_PORT: 8081
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
    volumes:
      - ../tools/docker-compose-wizard/security_env:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully

  aasrepository-go:
    image: eclipsebasyx/aasrepository-go:1.0.12
    container_name: aasrepository-go-oss-dev
    ports:
      - "5081:8081"
    environment:
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
    volumes:
      - ../tools/docker-compose-wizard/security_env:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully

  submodelrepository-go:
    image: eclipsebasyx/submodelrepository-go:1.0.12
    container_name: submodelrepository-go-oss-dev
    ports:
      - "5085:8081"
    environment:
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
      JWS_PRIVATEKEYPATH: ""
    volumes:
      - ../tools/docker-compose-wizard/security_env:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully

  conceptdescriptionrepository-go:
    image: eclipsebasyx/conceptdescriptionrepository-go:1.0.12
    container_name: conceptdescriptionrepository-go-oss-dev
    ports:
      - "5086:8081"
    environment:
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: localPostgres
      POSTGRES_PASSWORD: P@SSworDT!
      POSTGRES_DBNAME: basyx_core
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      ABAC_MODELPATH: /security_env/access-rules.json
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
    volumes:
      - ../tools/docker-compose-wizard/security_env:/security_env:ro
    networks:
      - aas-oss-dev-network
    restart: unless-stopped
    depends_on:
      basyx-config-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: aas-oss-dev-postgres-dev

networks:
  aas-oss-dev-network:
    driver: bridge
