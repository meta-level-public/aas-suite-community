<main class="plugin-page">
  <header class="page-header">
    <span class="eyebrow">AAS Suite Plugin</span>
    <h1>Hello World</h1>
    <p>
      This Angular app was built independently, bundled into a ZIP with a manifest, and loaded by the AAS Suite
      plugin host.
    </p>
  </header>

  <section class="card-grid">
    <article class="info-card info-card--info">
      <div class="info-card__icon-wrap">
        <div class="info-card__icon">📍</div>
      </div>
      <div class="info-card__body">
        <h3 class="info-card__title">Route</h3>
        <p class="info-card__description">/hello-world-demo</p>
      </div>
      <button class="info-card__button" type="button">Details</button>
    </article>

    <article class="info-card info-card--success">
      <div class="info-card__icon-wrap">
        <div class="info-card__icon">🕒</div>
      </div>
      <div class="info-card__body">
        <h3 class="info-card__title">Loaded</h3>
        <p class="info-card__description">{{ loadedAt }}</p>
      </div>
      <button class="info-card__button" type="button">Details</button>
    </article>
  </section>
</main>
